<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor DEC → Intelbras</title>
  <link rel="stylesheet" href="design-system/tokens.css">
  <link rel="stylesheet" href="design-system/trade-ui.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: var(--space-4);
      box-sizing: border-box; background: var(--bg-page); color: var(--fg-primary); font-family: var(--font-sans); }
    main { width: 100%; max-width: 480px; display: grid; gap: var(--space-4); }
    .topo { display: flex; justify-content: space-between; align-items: center; }
    .topo h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
    form { display: grid; gap: var(--space-4); }
    .resultado { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .hex { margin: 0; font-family: var(--font-mono); font-size: 28px; line-height: 34px;
      font-variant-numeric: tabular-nums; letter-spacing: 0.04em; color: var(--fg-primary); overflow-wrap: anywhere; }
    .hex:empty::before { content: '—'; color: var(--fg-muted); }
    .ajuda { margin: 0; font-size: 12px; line-height: 16px; color: var(--fg-secondary); }
  </style>
</head>
<body>
  <main>
    <div class="topo">
      <h1>Conversor DEC → Intelbras</h1>
      <button id="tema" type="button" class="tu-btn tu-btn--ghost tu-btn--icon tu-btn--md tu-btn--pill" aria-label="Alternar tema claro/escuro">
        <span class="tu-btn__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      </button>
    </div>

    <section class="tu-card tu-card--surface tu-card--pad-md">
      <div class="tu-card__body">
        <form id="form" novalidate>
          <div class="tu-field" id="campo">
            <label class="tu-field__label" for="dec">Código decimal</label>
            <div class="tu-input tu-input--lg">
              <input id="dec" class="tu-input__control" inputmode="numeric" autocomplete="off" placeholder="456566197" aria-describedby="dica" autofocus>
              <span class="tu-input__suffix">DEC</span>
            </div>
            <p id="dica" class="tu-field__hint">Número de 0 a 4294967295.</p>
          </div>
        </form>
      </div>
    </section>

    <section class="tu-card tu-card--elevated tu-card--pad-md" aria-live="polite">
      <header class="tu-card__header"><div class="tu-card__heading"><p class="tu-card__eyebrow">Hexadecimal Intelbras</p></div></header>
      <div class="tu-card__body">
        <div class="resultado">
          <p id="hex" class="hex"></p>
          <button id="copiar" type="button" class="tu-btn tu-btn--primary tu-btn--md tu-btn--pill" disabled>Copiar</button>
        </div>
      </div>
      <footer class="tu-card__footer"><p class="ajuda">Hex de 8 dígitos com os bytes em ordem invertida. Ex.: 456566197 → B5A5361B</p></footer>
    </section>
  </main>

  <script src="conversor.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const dica = $('dica').textContent;

    function converter() {
      const v = $('dec').value;
      let hex = '', erro = '';
      if (v.trim()) { try { hex = decParaIntelbras(v); } catch (e) { erro = e.message; } }
      $('hex').textContent = hex;
      $('copiar').disabled = !hex;
      $('campo').classList.toggle('tu-field--error', !!erro);
      $('dec').toggleAttribute('aria-invalid', !!erro);
      $('dica').textContent = erro || dica;
    }

    $('dec').addEventListener('input', converter);
    $('form').addEventListener('submit', (e) => { e.preventDefault(); converter(); });

    $('copiar').addEventListener('click', async () => {
      const texto = $('hex').textContent;
      // navigator.clipboard só existe em HTTPS/localhost; na rede interna (http://IP) usa o método antigo.
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(texto);
      } else {
        const t = document.createElement('textarea');
        t.value = texto;
        document.body.append(t);
        t.select();
        document.execCommand('copy');
        t.remove();
      }
      $('copiar').textContent = 'Copiado';
      setTimeout(() => ($('copiar').textContent = 'Copiar'), 1500);
    });

    const html = document.documentElement;
    if (matchMedia('(prefers-color-scheme: dark)').matches) html.dataset.theme = 'dark';
    $('tema').addEventListener('click', () => {
      html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
    });
  </script>
</body>
</html>
